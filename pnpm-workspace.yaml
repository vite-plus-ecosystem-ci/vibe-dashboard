packages:
  - apps/*
  - packages/*

catalog:
  "@tailwindcss/vite": ^4.1.13
  "@testing-library/react": ^16.3.0
  "@testing-library/user-event": ^14.6.1
  "@types/react": ^19.1.10
  "@types/react-dom": ^19.1.7
  "@types/semver": ^7.7.1
  lucide-react: ^1.0.0
  playwright: ^1.58.2
  react: ^19.1.1
  react-dom: ^19.1.1
  react-router-dom: ^7.8.2
  recharts: ^3.0.0
  semver: ^7.7.2
  tailwindcss: ^4.1.13
  top-github-dependents-by-stars: ^1.0.4
  typescript: ^7.0.0
  vite-plus: 0.0.0-commit.6bc2d240a024170c08fbc831f0c201c162afd22e
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.6bc2d240a024170c08fbc831f0c201c162afd22e
  vitest: 5.0.5
  void: 1.1.11
  "@vitest/browser-playwright": 5.0.5

minimumReleaseAgeExclude:
  # ecosystem-ci smoke test: preview builds and freshly pinned toolchain packages
  - "@oxc-project/*"
  - oxlint
  - "@oxlint/*"
  - oxfmt
  - "@oxfmt/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - vitest
  - "@vitest/*"
  - tinybench
  - yuku-core
  - yuku-parser
  - "@yuku-core/*"
  - "@yuku-toolchain/*"
  - vite-plus
  - "@voidzero-dev/*"
  - vitest
  - "@vitest/*"
  - "@void/*"
  - void

allowBuilds:
  "@parcel/watcher": true
  "@tailwindcss/oxide": true
  better-sqlite3: false
  esbuild: true
  workerd: false

onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@tailwindcss/oxide"
  - esbuild
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
